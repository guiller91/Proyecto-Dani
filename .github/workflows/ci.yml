name: Quality

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: PHP ${{ matrix.php }} / ${{ matrix.database }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.3'
                      database: mariadb:11.4
                    - php: '8.4'
                      database: mysql:8.4
                    - php: '8.5'
                      database: mariadb:11.4
        services:
            database:
                image: ${{ matrix.database }}
                env:
                    MYSQL_ROOT_PASSWORD: test-root
                    MYSQL_DATABASE: reservas_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root --silent || mariadb-admin ping -h 127.0.0.1 -ptest-root --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=25
        env:
            APP_ENV: test
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: reservas_test
            DB_USERNAME: root
            DB_PASSWORD: test-root
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_mysql, mbstring
                  coverage: none
                  tools: composer:v2
            - run: composer install --prefer-dist --no-interaction --no-progress
            - run: composer validate --strict
            - run: composer audit
            - run: php bin/import.php --test
            - run: composer check
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-report-${{ matrix.php }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    container:
        name: Container smoke test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - run: |
                  printf 'DB_DATABASE=reservas\nDB_USERNAME=reservas\nDB_PASSWORD=container-test-only\nDB_ROOT_PASSWORD=container-root-test-only\n' > .env
                  docker compose up --build --wait --wait-timeout 180
            - run: |
                  for attempt in $(seq 1 30); do
                    curl --fail --silent http://127.0.0.1:8080/api/reservas > /tmp/reservas.json && break
                    sleep 2
                  done
                  python3 -c 'import json; data=json.load(open("/tmp/reservas.json")); assert data["meta"]["total"] == 16; assert len(data["data"]) == 10'
                  curl --fail --silent http://127.0.0.1:8080/ | grep -q 'Tus reservas'
            - run: docker compose logs
              if: failure()
            - run: docker compose down
              if: always()
