services:
    app:
        build: .
        ports:
            - '127.0.0.1:8080:80'
        environment:
            APP_ENV: production
            APP_TIMEZONE: Europe/Madrid
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-reservas}
            DB_USERNAME: ${DB_USERNAME:-reservas}
            DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
    db:
        image: mariadb:11.4
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-reservas}
            MARIADB_USER: ${DB_USERNAME:-reservas}
            MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
        volumes:
            - database:/var/lib/mysql
            - ./database/database.sql:/docker-entrypoint-initdb.d/001-reservas.sql:ro
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s
        restart: unless-stopped
volumes:
    database:
